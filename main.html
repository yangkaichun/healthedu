<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>衛教影片系統管理平台</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 框架結構樣式 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        
        .frame-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        .top-frame {
            background-color: #2c3e50;
            color: white;
            padding: 10px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 100;
        }
        
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .main-nav {
            display: flex;
            justify-content: center;
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .main-nav li {
            margin: 0 10px;
        }
        
        .main-nav a {
            display: block;
            padding: 10px 20px;
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        
        .main-nav a:hover {
            background-color: #3498db;
        }
        
        .main-nav a.active {
            background-color: #3498db;
        }
        
        .bottom-frame {
            flex: 1;
            overflow: hidden;
            position: relative;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .page-title {
            margin: 0;
            font-size: 24px;
            text-align: center;
            padding: 10px 0;
        }
        
        /* 響應式設計 */
        @media (max-width: 768px) {
            .main-nav {
                flex-direction: column;
                align-items: center;
            }
            
            .main-nav li {
                margin: 5px 0;
                width: 100%;
                text-align: center;
            }
            
            .page-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="frame-container">
        <div class="top-frame">
            <h1 class="page-title">衛教影片系統管理平台</h1>
            <div class="nav-container">
                <ul class="main-nav">
                    <li><a href="index.html" target="content-frame" class="nav-link active" data-page="index">衛教主頁</a></li>
                    <li><a href="bed-selection.html" target="content-frame" class="nav-link" data-page="bed-selection">病床選擇</a></li>
                    <li><a href="results.html" target="content-frame" class="nav-link" data-page="results">問卷結果</a></li>
                    <li><a href="admin.html" target="content-frame" class="nav-link" data-page="admin">系統管理</a></li>
                </ul>
            </div>
        </div>
        
        <div class="bottom-frame">
            <iframe name="content-frame" id="content-frame" src="index.html"></iframe>
        </div>
    </div>

    <script>
        // 處理導航選項的啟用狀態
        document.addEventListener('DOMContentLoaded', function() {
            const navLinks = document.querySelectorAll('.nav-link');
            
            // 為每個導航項添加點擊事件處理
            navLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    // 移除所有鏈接的活動狀態
                    navLinks.forEach(l => l.classList.remove('active'));
                    
                    // 將當前點擊的鏈接設為活動狀態
                    this.classList.add('active');
                    
                    // 儲存當前頁面到sessionStorage
                    sessionStorage.setItem('currentPage', this.dataset.page);
                });
            });
            
            // 檢查是否有先前選擇的頁面
            const currentPage = sessionStorage.getItem('currentPage');
            if (currentPage) {
                // 找到對應的鏈接並模擬點擊
                const targetLink = document.querySelector(`.nav-link[data-page="${currentPage}"]`);
                if (targetLink) {
                    navLinks.forEach(l => l.classList.remove('active'));
                    targetLink.classList.add('active');
                    document.getElementById('content-frame').src = targetLink.href;
                }
            }
        });
        
        // 處理iframe中頁面的標題更新
        document.getElementById('content-frame').addEventListener('load', function() {
            // 嘗試獲取嵌入頁面的標題
            try {
                const iframeTitle = this.contentDocument.title;
                if (iframeTitle) {
                    document.querySelector('.page-title').textContent = '衛教影片系統 - ' + iframeTitle;
                }
            } catch (e) {
                // 如果因同源策略無法訪問標題，則忽略錯誤
                console.log('無法獲取iframe頁面標題');
            }
        });
    </script>
</body>
</html>
